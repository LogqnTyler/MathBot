<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathBot: Calculus Tutor for MATH 1191/1210</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #171717;
      --muted: #6b6b6b;
      --line: #dedede;
      --soft: #f6f6f4;
      --accent: #2455d6;
      --accent-dark: #173da5;
      --error: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    button,
    select,
    textarea {
      font: inherit;
    }

    .shell {
      width: min(100% - 40px, 760px);
      margin: 0 auto;
      padding: 28px 0 72px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      color: var(--ink);
      font-size: 14px;
      font-weight: 650;
      letter-spacing: -0.01em;
      text-decoration: none;
    }

    main {
      padding-top: 40px;
    }

    #practice-form {
      display: grid;
      gap: 18px;
      margin-top: 18px;
    }

    .field {
      display: grid;
      gap: 9px;
    }

    label {
      font-size: 14px;
      font-weight: 650;
    }

    .field-note {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    select {
      height: 48px;
      padding: 0 42px 0 14px;
      cursor: pointer;
    }

    textarea {
      min-height: 132px;
      padding: 13px 14px;
      resize: vertical;
    }

    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(36, 85, 214, 0.12);
    }

    textarea::placeholder {
      color: #999;
    }

    .form-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .char-count {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .submit-button {
      min-width: 164px;
      height: 46px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 650;
      transition: background 140ms ease, transform 100ms ease;
    }

    .submit-button:hover:not(:disabled) {
      background: var(--accent-dark);
    }

    .submit-button:active:not(:disabled) {
      transform: translateY(1px);
    }

    .submit-button:disabled {
      background: #b9c3dc;
      cursor: not-allowed;
    }

    .error {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-left: 3px solid var(--error);
      background: #fff5f4;
      color: var(--error);
      font-size: 14px;
    }

    .chat {
      display: grid;
      gap: 26px;
    }

    .message {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
    }

    .message.user {
      align-items: flex-end;
    }

    .message-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .message-bubble {
      max-width: min(88%, 660px);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 14px;
    }

    .message.user .message-bubble {
      border-color: #dbe3f7;
      background: #f3f6fd;
    }

    .message.assistant .message-bubble {
      width: min(100%, 700px);
      background: #fff;
    }

    .onboarding-copy {
      margin: 0;
      color: var(--muted);
    }

    .onboarding-complete {
      display: none;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    #practice-form.submitted {
      display: none;
    }

    #practice-form.submitted + .onboarding-complete {
      display: block;
    }

    .message.loading .message-bubble {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .answer {
      font-size: 16px;
    }

    .source-list {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .source-list-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .source-chip {
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--soft);
      color: #4f4f4f;
      font-size: 12px;
    }

    .answer strong {
      font-weight: 700;
    }

    .answer h3 {
      margin: 30px 0 8px;
      font-size: 16px;
    }

    .answer hr {
      margin: 28px 0;
      border: 0;
      border-top: 1px solid var(--line);
    }

    .answer code {
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.88em;
    }

    .answer .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      margin: 24px 0;
      padding: 18px;
      background: var(--soft);
      text-align: center;
    }

    .solution-reveal {
      margin-top: 22px;
      overflow: hidden;
      border: 1px solid #dbe3f7;
      border-radius: 10px;
      background: #fff;
    }

    .solution-reveal summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 15px 16px;
      background: #f3f6fd;
      color: var(--accent-dark);
      cursor: pointer;
      font-weight: 700;
      list-style: none;
    }

    .solution-reveal summary::-webkit-details-marker {
      display: none;
    }

    .solution-reveal summary::after {
      content: "+";
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
    }

    .solution-reveal[open] summary::after {
      content: "−";
    }

    .solution-prompt {
      display: grid;
      gap: 1px;
    }

    .solution-prompt small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .solution-content {
      padding: 18px;
      border-top: 1px solid #dbe3f7;
    }

    .follow-up-form {
      display: none;
      align-items: flex-end;
      gap: 10px;
      position: sticky;
      bottom: 0;
      margin-top: 34px;
      padding: 16px 0 6px;
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid var(--line);
    }

    .follow-up-form.active {
      display: flex;
    }

    .follow-up-form textarea {
      min-height: 48px;
      max-height: 150px;
      padding: 11px 13px;
      resize: vertical;
    }

    .follow-up-form button {
      flex: 0 0 auto;
      min-width: 88px;
    }

    @media (max-width: 600px) {
      .shell {
        width: min(100% - 28px, 760px);
        padding-top: 20px;
      }

      header {
        padding-bottom: 18px;
      }

      main {
        padding-top: 42px;
      }

      .form-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .char-count {
        align-self: flex-end;
      }

      .submit-button {
        width: 100%;
      }

      .message-bubble,
      .message.assistant .message-bubble {
        max-width: 94%;
        width: auto;
      }

      .follow-up-form {
        align-items: stretch;
        flex-direction: column;
      }

      .follow-up-form button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }

      .spinner {
        animation-duration: 1.4s;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/">MathBot: Calculus Tutor for MATH 1191/1210</a>
    </header>

    <main>
      <section class="chat" id="chat" role="log" aria-live="polite" aria-label="Conversation with MathBot">
        <article class="message assistant">
          <div class="message-label">MathBot</div>
          <div class="message-bubble">
            <p class="onboarding-copy">Choose a course topic and tell me what kind of practice problem you want.</p>
            <form id="practice-form">
              <div class="field">
                <label for="topic-select">Topic</label>
                <select id="topic-select" name="topic" required disabled>
                  <option value="">Loading topics...</option>
                </select>
              </div>

              <div class="field">
                <label for="practice-request">
                  Practice problem details
                  <span class="field-note">Add any functions, context, or difficulty you want.</span>
                </label>
                <textarea
                  id="practice-request"
                  name="practice-request"
                  maxlength="500"
                  required
                  placeholder="For example: Find the limit of a sine or cosine function."
                ></textarea>
              </div>

              <div class="form-footer">
                <span class="char-count" id="char-count">0 / 500</span>
                <button class="submit-button" id="submit-button" type="submit" disabled>
                  Generate problem
                </button>
              </div>
            </form>
            <p class="onboarding-complete" id="onboarding-complete"></p>
          </div>
        </article>
      </section>

      <div class="error" id="error" role="alert"></div>

      <form class="follow-up-form" id="follow-up-form">
        <textarea
          id="follow-up-input"
          maxlength="500"
          aria-label="Ask MathBot for clarification"
          placeholder="Ask for clarification about the problem or solution..."
        ></textarea>
        <button class="submit-button" id="follow-up-button" type="submit" disabled>Send</button>
      </form>
    </main>
  </div>

  <script>
    const form = document.getElementById('practice-form');
    const topicSelect = document.getElementById('topic-select');
    const practiceRequest = document.getElementById('practice-request');
    const charCount = document.getElementById('char-count');
    const submitButton = document.getElementById('submit-button');
    const errorBox = document.getElementById('error');
    const chat = document.getElementById('chat');
    const onboardingComplete = document.getElementById('onboarding-complete');
    const followUpForm = document.getElementById('follow-up-form');
    const followUpInput = document.getElementById('follow-up-input');
    const followUpButton = document.getElementById('follow-up-button');
    const conversation = [];
    let selectedTopic = '';

    async function loadTopics() {
      try {
        const response = await fetch('/topics');
        if (!response.ok) throw new Error(`Request failed (${response.status})`);

        const topics = await response.json();
        topicSelect.innerHTML = '<option value="">Select a topic</option>';

        topics.forEach((topic) => {
          const option = document.createElement('option');
          option.value = topic.name;
          option.textContent = topic.week == null
            ? topic.name
            : `Week ${topic.week}: ${topic.name}`;
          topicSelect.appendChild(option);
        });

        topicSelect.disabled = topics.length === 0;
        updateSubmitState();
      } catch (error) {
        topicSelect.innerHTML = '<option value="">Topics unavailable</option>';
        showError('Could not load course topics. Refresh the page to try again.');
      }
    }

    function updateSubmitState() {
      submitButton.disabled = !topicSelect.value || !practiceRequest.value.trim();
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = 'block';
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.style.display = 'none';
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatResponse(value) {
      const mathExpressions = [];
      const protectedValue = String(value ?? '').replace(
        /(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|\$[^$\n]+?\$)/g,
        (expression) => {
          const placeholder = `@@MATH_${mathExpressions.length}@@`;
          mathExpressions.push(expression);
          return placeholder;
        }
      );

      const formatted = escapeHtml(protectedValue)
        .replace(/^###\s+(.+)$/gm, '<h3>$1</h3>')
        .replace(/^---$/gm, '<hr>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+?)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');

      return formatted.replace(
        /@@MATH_(\d+)@@/g,
        (_, index) => escapeHtml(mathExpressions[Number(index)])
      );
    }

    function renderMath(element) {
      if (typeof renderMathInElement !== 'function') return;

      renderMathInElement(element, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false },
          { left: '$', right: '$', display: false }
        ],
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
        throwOnError: false
      });
    }

    function createSourceList(sources) {
      if (!Array.isArray(sources) || sources.length === 0) return null;

      const sourceList = document.createElement('div');
      sourceList.className = 'source-list';

      const label = document.createElement('span');
      label.className = 'source-list-label';
      label.textContent = 'Materials used';
      sourceList.appendChild(label);

      sources.forEach((source) => {
        const chip = document.createElement('span');
        chip.className = 'source-chip';
        chip.textContent = source;
        sourceList.appendChild(chip);
      });
      return sourceList;
    }

    function appendMessage(role, content, topic, clarification = false, sources = []) {
      const message = document.createElement('article');
      message.className = `message ${role}`;

      const label = document.createElement('div');
      label.className = 'message-label';
      label.textContent = role === 'user'
        ? `You / ${topic}${clarification ? ' / Clarification' : ' / With solution'}`
        : 'MathBot';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';

      if (role === 'assistant') {
        bubble.classList.add('answer');
        const sourceList = createSourceList(sources);
        if (sourceList) bubble.appendChild(sourceList);
        const responseContent = document.createElement('div');
        responseContent.innerHTML = formatResponse(content);
        bubble.appendChild(responseContent);
        renderMath(responseContent);
      } else {
        bubble.textContent = content;
      }

      message.append(label, bubble);
      chat.appendChild(message);
      message.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return message;
    }

    function appendPracticeMessage(problem, solution, sources) {
      const message = document.createElement('article');
      message.className = 'message assistant';

      const label = document.createElement('div');
      label.className = 'message-label';
      label.textContent = 'MathBot';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble answer';

      const sourceList = createSourceList(sources);
      if (sourceList) bubble.appendChild(sourceList);

      const problemHeading = document.createElement('strong');
      problemHeading.textContent = 'Practice Problem:';
      const problemContent = document.createElement('div');
      problemContent.innerHTML = formatResponse(problem);
      bubble.append(problemHeading, document.createElement('br'), problemContent);
      renderMath(problemContent);

      if (solution) {
        const details = document.createElement('details');
        details.className = 'solution-reveal';

        const summary = document.createElement('summary');
        summary.innerHTML = `
          <span class="solution-prompt">
            Try solving it yourself first
            <small>Reveal the complete worked solution when you are ready.</small>
          </span>
        `;

        const solutionContent = document.createElement('div');
        solutionContent.className = 'solution-content';
        solutionContent.innerHTML = formatResponse(solution);
        renderMath(solutionContent);
        details.append(summary, solutionContent);
        bubble.appendChild(details);
      }

      message.append(label, bubble);
      chat.appendChild(message);
      message.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return message;
    }

    function appendLoadingMessage(text = 'Building your practice problem...') {
      const message = document.createElement('article');
      message.className = 'message assistant loading';
      message.setAttribute('role', 'status');
      message.innerHTML = `
        <div class="message-label">MathBot</div>
        <div class="message-bubble">
          <span class="spinner" aria-hidden="true"></span>
          ${escapeHtml(text)}
        </div>
      `;
      chat.appendChild(message);
      message.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return message;
    }

    practiceRequest.addEventListener('input', () => {
      charCount.textContent = `${practiceRequest.value.length} / 500`;
      updateSubmitState();
    });

    topicSelect.addEventListener('change', updateSubmitState);

    followUpInput.addEventListener('input', () => {
      followUpButton.disabled = !followUpInput.value.trim();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearError();

      const topic = topicSelect.value;
      const request = practiceRequest.value.trim();
      appendMessage('user', request, topic);
      const loadingMessage = appendLoadingMessage();

      submitButton.disabled = true;
      submitButton.textContent = 'MathBot is working...';

      try {
        const response = await fetch('/generate_prompt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subject: topic,
            request_type: 'practice_problems',
            include_solution: true,
            other_details: request
          })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.detail || `Request failed (${response.status})`);
        }

        loadingMessage.remove();
        appendPracticeMessage(data.problem || data.response, data.solution || '', data.sources || []);
        selectedTopic = topic;
        conversation.push(
          { role: 'user', content: request },
          {
            role: 'assistant',
            content: `Practice Problem:\n${data.problem || data.response}\n\nWorked Solution:\n${data.solution || ''}`
          }
        );
        form.classList.add('submitted');
        onboardingComplete.textContent = `Topic selected: ${topic}`;
        followUpForm.classList.add('active');
        followUpInput.focus();
      } catch (error) {
        loadingMessage.remove();
        showError(error.message || 'Could not generate a problem. Please try again.');
      } finally {
        submitButton.textContent = 'Generate problem';
        if (!form.classList.contains('submitted')) updateSubmitState();
      }
    });

    followUpForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearError();

      const request = followUpInput.value.trim();
      if (!request || !selectedTopic) return;

      appendMessage('user', request, selectedTopic, true);
      const loadingMessage = appendLoadingMessage('Thinking about your question...');
      followUpButton.disabled = true;
      followUpButton.textContent = 'Thinking...';

      try {
        const response = await fetch('/generate_prompt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subject: selectedTopic,
            request_type: 'practice_problems',
            include_solution: true,
            follow_up: true,
            conversation: conversation.slice(-8),
            other_details: request
          })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.detail || `Request failed (${response.status})`);
        }

        loadingMessage.remove();
        appendMessage('assistant', data.response, selectedTopic, true, data.sources || []);
        conversation.push(
          { role: 'user', content: request },
          { role: 'assistant', content: data.response }
        );
        followUpInput.value = '';
        followUpInput.focus();
      } catch (error) {
        loadingMessage.remove();
        showError(error.message || 'Could not answer that question. Please try again.');
      } finally {
        followUpButton.textContent = 'Send';
        followUpButton.disabled = !followUpInput.value.trim();
      }
    });

    loadTopics();
  </script>
</body>
</html>
