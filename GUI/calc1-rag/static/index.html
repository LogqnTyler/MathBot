<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathBot</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg:        #0f0e0c;
      --surface:   #1a1916;
      --border:    #2e2c28;
      --accent:    #e8c87a;
      --accent2:   #7abfe8;
      --text:      #e8e4dc;
      --muted:     #7a7060;
      --success:   #7ae8a8;
      --error:     #e88a7a;
      --radius:    6px;
      --mono:      'DM Mono', monospace;
      --serif:     'DM Serif Display', serif;
      --sans:      'DM Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 260px 1fr 280px;
      grid-template-rows: 56px 1fr;
      grid-template-areas:
        "header header header"
        "sidebar main sources";
    }

    /* ── Header ── */
    header {
      grid-area: header;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-family: var(--serif);
      font-size: 1.25rem;
      color: var(--accent);
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-symbol {
      font-style: italic;
      font-size: 1.5rem;
      opacity: 0.85;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-label {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }

    /* ── Sidebar ── */
    nav {
      grid-area: sidebar;
      border-right: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px 0;
    }

    .nav-section-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 20px 8px;
      margin-top: 16px;
    }

    .nav-section-label:first-child { margin-top: 0; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 400;
      border-left: 2px solid transparent;
      transition: all 0.15s;
      cursor: pointer;
      background: none;
      border-top: none;
      border-right: none;
      border-bottom: none;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      color: var(--text);
      background: rgba(232,200,122,0.05);
    }

    .nav-item.active {
      color: var(--accent);
      border-left-color: var(--accent);
      background: rgba(232,200,122,0.08);
    }

    .nav-icon {
      font-size: 15px;
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }

    .topic-chip {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 3px;
      background: rgba(122,191,232,0.12);
      color: var(--accent2);
      margin-left: auto;
    }

    /* ── Main ── */
    main {
      grid-area: main;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      scroll-behavior: smooth;
    }

    .chat-window::-webkit-scrollbar { width: 4px; }
    .chat-window::-webkit-scrollbar-track { background: transparent; }
    .chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Welcome state */
    .welcome {
      margin: auto;
      text-align: center;
      max-width: 520px;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .welcome-title {
      font-family: var(--serif);
      font-size: 2.4rem;
      color: var(--accent);
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .welcome-title em {
      color: var(--text);
      font-style: italic;
    }

    .welcome-sub {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
      line-height: 1.7;
    }

    .starter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      text-align: left;
    }

    .starter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      color: var(--text);
      font-size: 13px;
      font-family: var(--sans);
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1.4;
      text-align: left;
    }

    .starter-btn:hover {
      border-color: var(--accent);
      background: rgba(232,200,122,0.06);
      color: var(--accent);
    }

    .starter-btn .starter-icon {
      display: block;
      font-size: 18px;
      margin-bottom: 6px;
    }

    /* Messages */
    .message {
      display: flex;
      gap: 14px;
      animation: fadeUp 0.3s ease both;
      max-width: 720px;
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.assistant { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-family: var(--mono);
      font-weight: 500;
    }

    .message.user .avatar {
      background: rgba(122,191,232,0.15);
      color: var(--accent2);
      border: 1px solid rgba(122,191,232,0.3);
    }

    .message.assistant .avatar {
      background: rgba(232,200,122,0.12);
      color: var(--accent);
      border: 1px solid rgba(232,200,122,0.25);
      font-family: var(--serif);
      font-style: italic;
    }

    .bubble {
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.7;
      max-width: 580px;
    }

    .message.user .bubble {
      background: rgba(122,191,232,0.1);
      border: 1px solid rgba(122,191,232,0.2);
      color: var(--text);
    }

    .message.assistant .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .bubble code {
      font-family: var(--mono);
      background: rgba(255,255,255,0.06);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 13px;
      color: var(--accent);
    }

    .bubble .katex-display,
    .source-card .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 10px 14px;
      margin: 10px 0;
      background: rgba(232,200,122,0.06);
      border-left: 2px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .bubble .katex,
    .source-card .katex { color: var(--accent); }

    .chunk-refs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .chunk-ref {
      font-family: var(--mono);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 3px;
      background: rgba(122,191,232,0.08);
      color: var(--accent2);
      border: 1px solid rgba(122,191,232,0.2);
      cursor: pointer;
      transition: all 0.12s;
    }

    .chunk-ref:hover {
      background: rgba(122,191,232,0.16);
    }

    /* Typing indicator */
    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 18px;
    }

    .typing span {
      width: 7px; height: 7px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s ease infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Picker card (topic + request-type selection) ── */
    .picker-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .picker-card.disabled {
      opacity: 0.55;
      pointer-events: none;
    }

    .picker-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      display: block;
    }

    .picker-select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 9px 12px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .picker-select:focus { border-color: var(--accent); }

    .picker-types {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .type-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 10px 12px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .type-btn:hover {
      border-color: var(--accent2);
      color: var(--accent2);
    }

    .type-btn.selected {
      border-color: var(--accent);
      background: rgba(232,200,122,0.08);
      color: var(--accent);
    }

    .type-icon {
      font-family: var(--serif);
      font-style: italic;
      font-size: 15px;
      width: 16px;
      text-align: center;
      flex-shrink: 0;
    }

    .picker-details-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 9px 12px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    .picker-details-input:focus { border-color: var(--accent); }

    .picker-char-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-align: right;
      margin-top: 4px;
    }

    .picker-submit-btn {
      align-self: flex-end;
      background: var(--accent);
      border: none;
      border-radius: 5px;
      padding: 9px 18px;
      color: var(--bg);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .picker-submit-btn:hover { opacity: 0.85; }
    .picker-submit-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .picker-error {
      font-size: 12px;
      color: var(--error);
      font-family: var(--mono);
    }


    /* ── Multiple-choice quiz ── */
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 14px 0;
    }

    .quiz-option {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #ffffff;
      text-align: left;
      cursor: pointer;
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      transition: border-color 0.15s, background 0.15s;
    }

    .quiz-option:hover {
      border-color: var(--accent);
    }

    .quiz-option.selected {
      border-color: var(--accent);
      background: rgba(232, 200, 122, 0.08);
    }

    .quiz-option.correct {
      border-color: #ffffff;
    }

    .quiz-option:disabled {
      cursor: default;
      opacity: 0.8;
    }

    .quiz-option-letter {
      flex: 0 0 24px;
      font-family: var(--mono);
      font-weight: 500;
      color: #ffffff;
    }

    .quiz-option-text {
      flex: 1;
      color: #ffffff;
    }

    .quiz-feedback {
      color: #ffffff;
    }

        /* ── Interactive three-attempt quiz ── */
    .quiz-card {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .quiz-attempt-status {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .quiz-answer-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .quiz-answer-input {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 9px 12px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    .quiz-answer-input:focus {
      border-color: var(--accent);
    }

    .quiz-submit-btn {
      background: var(--accent);
      border: none;
      border-radius: 5px;
      padding: 9px 16px;
      color: var(--bg);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .quiz-submit-btn:hover { opacity: 0.85; }

    .quiz-submit-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .quiz-feedback {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.6;
    }

    .quiz-feedback:empty {
      display: none;
    }

    .quiz-complete {
      margin-top: 10px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    /* ── Input area ── */
    .input-area {
      padding: 40px;
      background: var(--bg);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      transition: border-color 0.15s;
    }

    .input-row:focus-within {
      border-color: var(--accent);
    }

    #question-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      resize: none;
      line-height: 1.6;
      height: 95px;
      min-height: 95px;
      max-height: 300px;
    }

    #question-input::placeholder { color: var(--muted); }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 5px;
      width: 36px; height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
      color: var(--bg);
      font-size: 16px;
    }

    .send-btn:hover { opacity: 0.85; }
    .send-btn:active { transform: scale(0.94); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .input-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      font-family: var(--mono);
      text-align: right;
    }

    /* ── Sources panel ── */
    aside {
      grid-area: sources;
      border-left: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .aside-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chunk-count {
      background: rgba(232,200,122,0.12);
      color: var(--accent);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 3px;
    }

    .sources-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sources-list::-webkit-scrollbar { width: 3px; }
    .sources-list::-webkit-scrollbar-thumb { background: var(--border); }

    .source-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.15s;
      animation: fadeUp 0.3s ease both;
    }

    .source-card:hover {
      border-color: var(--accent2);
      background: rgba(122,191,232,0.04);
    }

    .source-card.highlighted {
      border-color: var(--accent);
      background: rgba(232,200,122,0.05);
    }

    .source-topic {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--accent2);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .source-text {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .source-score {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .score-bar {
      flex: 1;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.6s ease;
    }

    .score-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }

    .sources-empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 40px 20px;
    }

    .sources-empty .empty-icon {
      font-size: 28px;
      display: block;
      margin-bottom: 10px;
      opacity: 0.4;
    }

    /* History section in sidebar */
    .history-item {
      padding: 8px 20px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.12s;
    }

    .history-item:hover { color: var(--text); }

    /* Skip link for accessibility */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 8px;
      background: var(--accent);
      color: var(--bg);
      padding: 8px 12px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      z-index: 100;
      transition: top 0.15s;
      text-decoration: none;
    }

    .skip-link:focus { top: 8px; }
  </style>
</head>
<body>

  <a href="#question-input" class="skip-link">Skip to input</a>

  <!-- ── Header ── -->
  <header role="banner">
    <div class="logo" aria-label="MathBot">
      <span class="logo-symbol" aria-hidden="true">∫</span>
      MathBot
    </div>
    <div class="header-meta" role="status" aria-live="polite">
      <div class="status-dot" aria-hidden="true"></div>
      <span class="status-label">RAG · Connected</span>
    </div>
  </header>

  <!-- ── Sidebar ── -->
  <nav aria-label="Topics and history">
    <span class="nav-section-label">Topics</span>
    <div id="topics-nav" aria-label="Course topics">
      <div class="history-item">Loading topics…</div>
    </div>

    <span class="nav-section-label">Recent</span>
    <div id="history-list" aria-label="Conversation history">
      <div class="history-item" id="history-empty">No questions yet.</div>
    </div>
  </nav>

  <!-- ── Main chat ── -->
  <main id="main-content" aria-label="Chat">
    <div class="chat-window" id="chat-window" role="log" aria-live="polite" aria-label="Conversation">
<!-- Input -->
    <div class="input-area">
      <div class="input-row">
        <textarea
          id="question-input"
          rows="1"
          placeholder="Ask MathBot"
          aria-label="Your question"
          aria-multiline="true"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="send-btn" onclick="submitQuestion()" aria-label="Send question" disabled>
          ↑
        </button>
      </div>
      <p class="input-hint" aria-hidden="true">Enter to send · Shift+Enter for new line</p>
    </div>
  </main>

  <!-- ── Sources panel ── -->
  <aside aria-label="Retrieved sources">
    <div class="aside-header">
      <span>Sources</span>
      <span class="chunk-count" id="chunk-count" aria-live="polite">0 chunks</span>
    </div>
    <div class="sources-list" id="sources-list" role="list">
      <div class="sources-empty" aria-label="No sources yet">
        <span class="empty-icon" aria-hidden="true">◎</span>
        Sources retrieved from your course materials will appear here.
      </div>
    </div>
  </aside>

  <script>
    // ── State ──
    const input = document.getElementById('question-input');
    const sendBtn = document.getElementById('send-btn');
    const chatWindow = document.getElementById('chat-window');
    const sourcesList = document.getElementById('sources-list');
    const chunkCount = document.getElementById('chunk-count');
    let messageCount = 0;

    // Pseudonymous research/session identifier. It contains no student name,
    // email address, Canvas ID, or other direct identifier.
    let sessionId = sessionStorage.getItem('mathbot-session-id');
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      sessionStorage.setItem('mathbot-session-id', sessionId);
    }

    // Topics loaded from GET /topics (backed by JSON/lessonN.json files)
    let TOPICS = [];

    // Request types students can ask for. `subject` template mirrors
    // REQUEST_TYPE_TEMPLATES on the backend, purely for display purposes here.
    const REQUEST_TYPES = [
      { id: 'practice_problems',      label: 'Practice Problems',       icon: '✎' },
      { id: 'alternate_explanations', label: 'Alternate Explanations',  icon: '≈' },
      { id: 'concept_summary',        label: 'Concept Summary',         icon: '§' },
      { id: 'quiz_me',                label: 'Quiz Me',                 icon: '?' },
    ];

    const OTHER_DETAILS_MAX_LEN = 500; // matches backend GeneratePrompt.other_details

    async function loadTopics() {
      try {
        const res = await fetch('/topics');
        if (!res.ok) throw new Error(`Status ${res.status}`);
        TOPICS = await res.json();
        renderTopicNav();
      } catch (err) {
        console.error('Failed to load topics:', err);
        TOPICS = [];
        renderTopicNav();
      }
    }

    function renderTopicNav(activeTopic = null) {
      const nav = document.getElementById('topics-nav');
      if (!nav) return;

      nav.innerHTML = '';

      if (TOPICS.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'history-item';
        empty.textContent = 'No topics available.';
        nav.appendChild(empty);
        return;
      }

      TOPICS.forEach(topic => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'nav-item';

        if (topic.name === activeTopic) {
          btn.classList.add('active');
          btn.setAttribute('aria-current', 'page');
        }

        const icon = document.createElement('span');
        icon.className = 'nav-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = '›';

        const label = document.createElement('span');
        label.textContent = topic.name;

        btn.appendChild(icon);
        btn.appendChild(label);

        btn.addEventListener('click', () => {
          renderTopicNav(topic.name);

          appendPicker('', topic.name);
        });

        nav.appendChild(btn);
      });
    }

    loadTopics();

    // ── Input handling ──
    input.addEventListener('input', () => {
      sendBtn.disabled = input.value.trim().length === 0;
    });

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 160) + 'px';
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) submitQuestion();
      }
    }


    function filterTopic(topic) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      event.currentTarget.classList.add('active');
      // Wire to backend filter in real implementation
    }

    // ── Submit: initial free-text prompt → show topic/type picker ──
    async function submitQuestion() {
      // Keep the exact browser text for research logging.
      const originalQuestion = input.value;
      const question = originalQuestion.trim();
      if (!question) return;

      appendMessage('user', question);
      input.value = '';
      input.style.height = '95px';
      input.disabled = true;
      sendBtn.disabled = true;

      addHistory(question);

      try {
        const response = await fetch('/ask', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            question: originalQuestion,
            session_id: sessionId,
          }),
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`MathBot request failed: ${response.status} ${errorText}`);
        }

        const data = await response.json();

        appendMessage(
          'assistant',
          data.response,
          [],
          'generated-response'
        );

        renderSources(data.sources || []);

        if (data.subject && data.subject !== 'Unclassified') {
          renderTopicNav(data.subject);
        }
      } catch (error) {
        console.error(error);
        appendMessage(
          'assistant',
          'MathBot could not generate a response. Please try again.'
        );
      } finally {
        input.disabled = false;
        sendBtn.disabled = input.value.trim().length === 0;
        input.focus();
      }
    }


    function appendPicker(initialPrompt, preselectedTopic = null) {
      // Only one active task should be visible at a time.
      // Keep student messages, but remove the previous picker and generated response.
      document.querySelectorAll('.message.active-picker, .message.generated-response')
        .forEach(el => el.remove());

      messageCount++;

      const msg = document.createElement('div');
      msg.className = 'message assistant active-picker';
      msg.setAttribute('role', 'article');
      msg.setAttribute('aria-label', 'Assistant: choose a topic and request type');

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = '∫';

      const card = document.createElement('div');
      card.className = 'picker-card';
      card.setAttribute('role', 'form');
      card.setAttribute('aria-label', 'Topic and request type selection');

      // Topic dropdown
      const topicLabel = document.createElement('label');
      topicLabel.className = 'picker-label';
      topicLabel.textContent = 'Which topic?';
      topicLabel.htmlFor = `topic-select-${messageCount}`;

      const topicSelect = document.createElement('select');
      topicSelect.className = 'picker-select';
      topicSelect.id = `topic-select-${messageCount}`;

      if (TOPICS.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = 'No topics available';
        opt.disabled = true;
        opt.selected = true;
        topicSelect.appendChild(opt);
        topicSelect.disabled = true;
      } else {
        const placeholder = document.createElement('option');
        placeholder.textContent = 'Select a topic…';
        placeholder.value = '';
        placeholder.disabled = true;
        placeholder.selected = true;
        topicSelect.appendChild(placeholder);

        TOPICS.forEach(topic => {
          const opt = document.createElement('option');
          opt.value = topic.name; // backend validates subject against KEYWORDS by name
          opt.textContent = topic.week != null ? `Week ${topic.week} — ${topic.name}` : topic.name;

          if (topic.name === preselectedTopic) {
            opt.selected = true;
            placeholder.selected = false;
          }

          topicSelect.appendChild(opt);
        });
      }

      // Request-type buttons
      const typeLabel = document.createElement('div');
      typeLabel.className = 'picker-label';
      typeLabel.textContent = 'What would you like?';

      const typeGrid = document.createElement('div');
      typeGrid.className = 'picker-types';
      typeGrid.setAttribute('role', 'radiogroup');
      typeGrid.setAttribute('aria-label', 'Request type');

      let selectedType = null;
      const typeButtons = [];

      REQUEST_TYPES.forEach(rt => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'type-btn';
        btn.setAttribute('role', 'radio');
        btn.setAttribute('aria-checked', 'false');
        btn.innerHTML = `<span class="type-icon" aria-hidden="true">${rt.icon}</span> ${rt.label}`;
        btn.onclick = () => {
          selectedType = rt.id;
          typeButtons.forEach(b => {
            b.el.classList.remove('selected');
            b.el.setAttribute('aria-checked', 'false');
          });
          btn.classList.add('selected');
          btn.setAttribute('aria-checked', 'true');
          updateSubmitState();
        };
        typeButtons.push({ id: rt.id, el: btn });
        typeGrid.appendChild(btn);
      });

      // Optional extra details
      const detailsLabel = document.createElement('label');
      detailsLabel.className = 'picker-label';
      detailsLabel.textContent = 'Anything specific? (optional)';
      detailsLabel.htmlFor = `details-input-${messageCount}`;

      const detailsInput = document.createElement('input');
      detailsInput.type = 'text';
      detailsInput.className = 'picker-details-input';
      detailsInput.id = `details-input-${messageCount}`;
      detailsInput.placeholder = 'e.g. "use a biology application"';
      detailsInput.maxLength = OTHER_DETAILS_MAX_LEN;

      const charCount = document.createElement('div');
      charCount.className = 'picker-char-count';
      charCount.textContent = `0 / ${OTHER_DETAILS_MAX_LEN}`;
      detailsInput.addEventListener('input', () => {
        charCount.textContent = `${detailsInput.value.length} / ${OTHER_DETAILS_MAX_LEN}`;
      });

      // Error message (shown on failed submit)
      const errorMsg = document.createElement('div');
      errorMsg.className = 'picker-error';
      errorMsg.style.display = 'none';

      // Submit
      const submitBtn = document.createElement('button');
      submitBtn.type = 'button';
      submitBtn.className = 'picker-submit-btn';
      submitBtn.textContent = 'Continue';
      submitBtn.disabled = true;

      function updateSubmitState() {
        submitBtn.disabled = !(topicSelect.value && selectedType);
      }
      topicSelect.addEventListener('change', () => {
        updateSubmitState();
        renderTopicNav(topicSelect.value || null);
      });

      if (preselectedTopic) {
        renderTopicNav(preselectedTopic);
      }

      submitBtn.onclick = async () => {
        errorMsg.style.display = 'none';
        card.classList.add('disabled');
        submitBtn.textContent = 'Working…';

        const typing = 'typing-' + Date.now();
        appendTyping(typing);

        try {
          await requestGeneration({
            subject: topicSelect.value,
            requestType: selectedType,
            initialPrompt,
            details: detailsInput.value.trim(),
            typingId: typing,
          });
        } catch (err) {
          document.getElementById(typing)?.remove();
          card.classList.remove('disabled');
          submitBtn.textContent = 'Continue';
          errorMsg.textContent = err.message || 'Something went wrong. Please try again.';
          errorMsg.style.display = 'block';
        }
      };

      card.appendChild(topicLabel);
      card.appendChild(topicSelect);
      card.appendChild(typeLabel);
      card.appendChild(typeGrid);
      card.appendChild(detailsLabel);
      card.appendChild(detailsInput);
      card.appendChild(charCount);
      card.appendChild(errorMsg);
      card.appendChild(submitBtn);

      msg.appendChild(avatar);
      msg.appendChild(card);
      chatWindow.appendChild(msg);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // ── Call backend /generate_prompt with the chosen topic + request type ──
    async function requestGeneration({ subject, requestType, initialPrompt, details, typingId }) {
      // Combine the student's original message with any extra details they
      // typed, trimmed to the backend's 120-char limit on other_details.
      const combinedDetails = [initialPrompt, details].filter(Boolean).join('\n\n').slice(0, OTHER_DETAILS_MAX_LEN);

      const response = await fetch('/generate_prompt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          subject,
          request_type: requestType,
          other_details: combinedDetails,
          session_id: sessionId,
        }),
      });

      document.getElementById(typingId)?.remove();

      if (!response.ok) {
        const errBody = await response.json().catch(() => ({}));
        throw new Error(errBody.detail || `Request failed (${response.status})`);
      }

      const data = await response.json();

      // Show the exact course chunks used to ground this response.
      renderSources(data.sources || []);

      // The main composer was disabled when the student's message was sent.
      // Restore it after generation so another prompt can be entered without
      // refreshing the page.
      sendBtn.disabled = input.value.trim().length === 0;
      input.disabled = false;

      if (requestType === 'quiz_me') {
        appendQuizMessage(subject, data.quiz);
        return;
      }

      if (requestType === 'practice_problems' && data.problem) {
        appendPracticeProblemMessage(subject, data.problem, data.solution || '');
        return;
      }

      const typeLabel = REQUEST_TYPES.find(rt => rt.id === requestType)?.label || requestType;
      appendMessage(
        'assistant',
        `**${typeLabel} — ${subject}**\n\n${data.response}`,
        [],
        'generated-response'
      );
    }


    function appendPracticeProblemMessage(subject, problem, solution) {
      messageCount++;

      const msg = document.createElement('div');
      msg.className = 'message assistant generated-response';
      msg.setAttribute('role', 'article');
      msg.setAttribute('aria-label', `Practice problem about ${subject}`);

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = '∫';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      const problemContent = document.createElement('div');
      problemContent.innerHTML = formatContent(
        `**Practice Problems — ${subject}**\n\n${problem}`
      );
      renderMath(problemContent);
      bubble.appendChild(problemContent);

      if (solution) {
        const showSolution = document.createElement('button');
        showSolution.type = 'button';
        showSolution.className = 'quiz-submit-btn';
        showSolution.textContent = 'Show Solution';
        showSolution.setAttribute('aria-expanded', 'false');

        const solutionContent = document.createElement('div');
        solutionContent.className = 'quiz-feedback';
        solutionContent.style.display = 'none';
        solutionContent.innerHTML = formatContent(
          `**Solution**\n\n${solution}`
        );
        renderMath(solutionContent);

        showSolution.addEventListener('click', () => {
          const hidden = solutionContent.style.display === 'none';

          solutionContent.style.display = hidden ? 'block' : 'none';
          showSolution.textContent = hidden ? 'Hide Solution' : 'Show Solution';
          showSolution.setAttribute('aria-expanded', hidden ? 'true' : 'false');

          if (hidden) {
            chatWindow.scrollTop = chatWindow.scrollHeight;
          }
        });

        bubble.appendChild(showSolution);
        bubble.appendChild(solutionContent);
      }

      msg.appendChild(avatar);
      msg.appendChild(bubble);
      chatWindow.appendChild(msg);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }


    function appendQuizMessage(subject, quiz) {
      messageCount++;

      const msg = document.createElement('div');
      msg.className = 'message assistant generated-response';
      msg.setAttribute('role', 'article');
      msg.setAttribute('aria-label', `Quiz question about ${subject}`);

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = '∫';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      const heading = document.createElement('div');
      heading.innerHTML = formatContent(
        `**Quiz Me — ${subject}**\n\n${quiz.question}`
      );
      renderMath(heading);
      bubble.appendChild(heading);

      const quizCard = document.createElement('div');
      quizCard.className = 'quiz-card';

      const status = document.createElement('div');
      status.className = 'quiz-attempt-status';
      status.textContent = 'Attempt 1 of 3';

      const optionsContainer = document.createElement('div');
      optionsContainer.className = 'quiz-options';
      optionsContainer.setAttribute('role', 'radiogroup');
      optionsContainer.setAttribute('aria-label', 'Answer choices');

      const feedback = document.createElement('div');
      feedback.className = 'quiz-feedback';
      feedback.setAttribute('aria-live', 'polite');

      let selectedAnswer = null;
      let attempt = 1;
      let finished = false;

      ['A', 'B', 'C', 'D'].forEach(letter => {
        const option = document.createElement('button');
        option.type = 'button';
        option.className = 'quiz-option';
        option.setAttribute('role', 'radio');
        option.setAttribute('aria-checked', 'false');

        option.innerHTML = `
          <span class="quiz-option-letter">${letter}</span>
          <span class="quiz-option-text">${formatContent(quiz.options[letter])}</span>
        `;

        option.addEventListener('click', () => {
          if (finished) return;

          selectedAnswer = letter;

          optionsContainer.querySelectorAll('.quiz-option').forEach(btn => {
            btn.classList.remove('selected');
            btn.setAttribute('aria-checked', 'false');
          });

          option.classList.add('selected');
          option.setAttribute('aria-checked', 'true');
          submit.disabled = false;
        });

        optionsContainer.appendChild(option);
      });

      const submit = document.createElement('button');
      submit.className = 'quiz-submit-btn';
      submit.type = 'button';
      submit.textContent = 'Check Answer';
      submit.disabled = true;

      quizCard.appendChild(status);
      quizCard.appendChild(optionsContainer);
      quizCard.appendChild(submit);
      quizCard.appendChild(feedback);
      bubble.appendChild(quizCard);

      msg.appendChild(avatar);
      msg.appendChild(bubble);
      chatWindow.appendChild(msg);
      chatWindow.scrollTop = chatWindow.scrollHeight;

      renderMath(optionsContainer);

      async function submitAnswer() {
        if (!selectedAnswer || finished) return;

        submit.disabled = true;
        optionsContainer.querySelectorAll('.quiz-option').forEach(btn => {
          btn.disabled = true;
        });
        submit.textContent = 'Checking...';
        feedback.textContent = '';

        try {
          const response = await fetch('/check_answer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              subject,
              question: quiz.question,
              student_answer: selectedAnswer,
              correct_answer: quiz.correct_answer,
              hint_1: quiz.hint_1,
              hint_2: quiz.hint_2,
              solution: quiz.solution,
              attempt,
            }),
          });

          if (!response.ok) {
            const errBody = await response.json().catch(() => ({}));
            throw new Error(
              errBody.detail || `Request failed (${response.status})`
            );
          }

          const data = await response.json();

          feedback.innerHTML = formatContent(data.feedback || '');
          renderMath(feedback);

          if (data.correct) {
            finished = true;
            status.textContent = 'Complete';

            const selected = optionsContainer.querySelector(
              `.quiz-option:nth-child(${['A', 'B', 'C', 'D'].indexOf(selectedAnswer) + 1})`
            );

            if (selected) selected.classList.add('correct');

            submit.style.display = 'none';
            return;
          }

          if (attempt >= 3) {
            finished = true;
            status.textContent = 'Complete';

            if (data.solution) {
              const solution = document.createElement('div');
              solution.className = 'quiz-feedback';
              solution.innerHTML = formatContent(
                `**Solution**\n\n${data.solution}`
              );
              renderMath(solution);
              quizCard.appendChild(solution);
            }

            submit.style.display = 'none';
            return;
          }

          attempt += 1;
          status.textContent = `Attempt ${attempt} of 3`;
          submit.textContent = 'Try Again';

          optionsContainer.querySelectorAll('.quiz-option').forEach(btn => {
            btn.disabled = false;
            btn.classList.remove('selected');
            btn.setAttribute('aria-checked', 'false');
          });

          selectedAnswer = null;
          submit.disabled = true;

        } catch (error) {
          feedback.textContent = `Error: ${error.message}`;

          optionsContainer.querySelectorAll('.quiz-option').forEach(btn => {
            btn.disabled = false;
          });

          submit.disabled = !selectedAnswer;
          submit.textContent = 'Check Answer';
        }
      }

      submit.addEventListener('click', submitAnswer);
    }


    function appendMessage(role, content, chunks = [], extraClass = '') {
      messageCount++;
      const msg = document.createElement('div');
      msg.className = `message ${role}${extraClass ? ' ' + extraClass : ''}`;
      msg.setAttribute('role', 'article');
      msg.setAttribute('aria-label', `${role === 'user' ? 'You' : 'Assistant'}: ${content.substring(0, 60)}`);

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = role === 'user' ? 'U' : '∫';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = formatContent(content);
      renderMath(bubble);

      if (chunks.length > 0) {
        const refs = document.createElement('div');
        refs.className = 'chunk-refs';
        refs.setAttribute('aria-label', 'Referenced chunks');
        chunks.forEach((c, i) => {
          const chip = document.createElement('button');
          chip.className = 'chunk-ref';
          chip.textContent = `chunk_${c.id}`;
          chip.setAttribute('aria-label', `View source chunk ${c.id}`);
          chip.onclick = () => highlightSource(c.id);
          refs.appendChild(chip);
        });
        bubble.appendChild(refs);
      }

      msg.appendChild(avatar);
      msg.appendChild(bubble);
      chatWindow.appendChild(msg);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function escapeHtml(text) {
      return String(text ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatContent(text) {
      let source = String(text ?? '');
      const mathBlocks = [];

      // Protect LaTeX before doing any Markdown/HTML formatting.
      // This prevents <br> tags and Markdown replacements from being
      // inserted inside cases, aligned, arrays, fractions, etc.
      source = source.replace(
        /\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)/g,
        match => {
          const token = `MATHBLOCKTOKEN${mathBlocks.length}ENDTOKEN`;
          mathBlocks.push(match);
          return token;
        }
      );

      let formatted = escapeHtml(source);

      // Gemini occasionally uses Markdown backticks for ordinary math.
      // Convert math-like backtick content to KaTeX inline delimiters.
      formatted = formatted.replace(/`([^`\n]+)`/g, (match, content) => {
        const looksLikeMath =
          /[=+\-*/^_{}\\]/.test(content) ||
          /^[A-Za-z]\([^)]*\)$/.test(content) ||
          /^[A-Za-z]\s*[<>≤≥]\s*/.test(content) ||
          /^-?\d+(\.\d+)?$/.test(content);

        return looksLikeMath
          ? `\\(${content}\\)`
          : `<code>${content}</code>`;
      });

      formatted = formatted
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');

      // Restore the protected LaTeX exactly as generated.
      mathBlocks.forEach((math, index) => {
        const token = `MATHBLOCKTOKEN${index}ENDTOKEN`;
        formatted = formatted.replace(token, math);
      });

      return formatted;
    }

    function renderMath(element) {
      if (typeof renderMathInElement !== 'function') return;

      renderMathInElement(element, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false },
          { left: '$', right: '$', display: false }
        ],
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
        throwOnError: false
      });
    }

    function appendTyping(id) {
      const msg = document.createElement('div');
      msg.className = 'message assistant';
      msg.id = id;
      msg.setAttribute('aria-label', 'Assistant is typing');
      msg.setAttribute('aria-live', 'polite');

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = '∫';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<div class="typing" aria-hidden="true"><span></span><span></span><span></span></div>';

      msg.appendChild(avatar);
      msg.appendChild(bubble);
      chatWindow.appendChild(msg);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function addHistory(question) {
      const historyList = document.getElementById('history-list');

      // Remove the initial empty-state message once a real question exists.
      const empty = document.getElementById('history-empty');
      if (empty) empty.remove();

      const item = document.createElement('div');
      item.className = 'history-item';
      item.textContent = question.length > 36 ? question.substring(0, 36) + '…' : question;
      item.tabIndex = 0;
      item.setAttribute('role', 'button');
      item.setAttribute('aria-label', `Revisit: ${question}`);

      const revisit = () => {
        input.value = question;
        autoResize(input);
        sendBtn.disabled = false;
        input.focus();
      };

      item.addEventListener('click', revisit);
      item.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          revisit();
        }
      });

      historyList.prepend(item);
    }

    function highlightSource(id) {
      document.querySelectorAll('.source-card').forEach(c => c.classList.remove('highlighted'));
      const card = document.getElementById(`source-${id}`);
      if (card) {
        card.classList.add('highlighted');
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function renderSources(chunks) {
      sourcesList.innerHTML = '';
      chunkCount.textContent = `${chunks.length} chunk${chunks.length !== 1 ? 's' : ''}`;

      chunks.forEach((chunk, i) => {
        const card = document.createElement('div');
        card.className = 'source-card';
        card.id = `source-${chunk.id}`;
        card.setAttribute('role', 'listitem');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', `Source chunk ${chunk.id}: ${chunk.topic}`);
        card.style.animationDelay = `${i * 0.06}s`;

        card.innerHTML = `
          <div class="source-topic">${escapeHtml(chunk.topic)}</div>
          <div class="source-text">${formatContent(chunk.text)}</div>
          ${typeof chunk.score === 'number' ? `
            <div class="source-score" aria-label="Relevance score ${Math.round(chunk.score * 100)}%">
              <div class="score-bar" aria-hidden="true">
                <div class="score-fill" style="width: ${chunk.score * 100}%"></div>
              </div>
              <span class="score-label">${Math.round(chunk.score * 100)}%</span>
            </div>
          ` : `
            <div class="source-score">
              <span class="score-label">Course topic match</span>
            </div>
          `}
        `;
        renderMath(card);

        sourcesList.appendChild(card);
      });
    }
  </script>
</body>
</html>
