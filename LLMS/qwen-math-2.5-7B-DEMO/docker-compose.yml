services:
  vllm:
    image: vllm/vllm-openai:latest
    command:
      - Qwen/Qwen2.5-Math-7B-Instruct
      - --dtype=bfloat16
      # 7B bf16 is tight on 16GB GPUs; keep demo context modest.
      - --max-model-len=2048
      - --max-num-seqs=1
      # Avoid torch.compile/autotune VRAM spikes during startup.
      - --enforce-eager
      - --no-enable-flashinfer-autotune
      # 7B bf16 weights use most of a 16GB GPU; lower this only if using a
      # smaller or quantized model.
      - --gpu-memory-utilization=0.96
      - --cpu-offload-gb=8
    environment:
      - VLLM_USE_FLASHINFER_SAMPLER=0
    ports:
      - "8000:8000"
    volumes:
      # Cache weights on the host so you download once (~15GB).
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health'); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 120         # first weight download can take 20+ minutes
      start_period: 120s

  demo:
    build: .
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      - VLLM_URL=http://vllm:8000/v1
      - MODEL=Qwen/Qwen2.5-Math-7B-Instruct
      # Override the problem without rebuilding:
      # PROBLEM: "Compute \\int_0^1 x^2 e^x dx."
    # The model-generated Python is executed *inside this container*,
    # isolated from your host. That isolation is the sandbox.
